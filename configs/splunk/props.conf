# props.conf - Field Extractions and Parsing

[WinEventLog:Security]
SHOULD_LINEMERGE = true
TRUNCATE = 999999
KV_MODE = auto
TIME_PREFIX = ^
TIME_FORMAT = %m/%d/%Y %I:%M:%S %p
TZ = UTC

# Extract source IP from failed/successful logon events
EXTRACT-src_ip = Source Network Address:\s+(?<src_ip>\d+\.\d+\.\d+\.\d+)
EXTRACT-src_port = Source Port:\s+(?<src_port>\d+)
EXTRACT-workstation = Workstation Name:\s+(?<workstation>\w+)
EXTRACT-logon_type = Logon Type:\s+(?<logon_type>\d+)
EXTRACT-process_name = Process Name:\s+(?<process_name>[^\r\n]+)
EXTRACT-authentication_package = Authentication Package:\s+(?<authentication_package>\w+)
EXTRACT-lm_package = Package Name \(NTLM only\):\s+(?<lm_package>\w+)

# Field aliases for CIM compliance
FIELDALIAS-src = src_ip AS src
FIELDALIAS-dest = ComputerName AS dest
FIELDALIAS-user = Account_Name AS user
FIELDALIAS-signature = EventCode AS signature
FIELDALIAS-signature_id = EventCode AS signature_id
FIELDALIAS-dest_nt_host = ComputerName AS dest_nt_host

# Lookups
LOOKUP-eventcode = windows_eventcodes EventCode OUTPUT description category

[opnsense]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+
TIME_FORMAT = %b %d %H:%M:%S
TZ = UTC
KV_MODE = none

# Extract fields from filterlog format
EXTRACT-filter_fields = filterlog\[\d+\]:\s+(?<rule_number>\d+),(?<sub_rule>[^,]*),(?<anchor>[^,]*),(?<tracker>[^,]*),(?<interface>[^,]*),(?<reason>[^,]*),(?<action>[^,]*),(?<direction>[^,]*),(?<ip_version>\d+),(?<tos>[^,]*),(?<ecn>[^,]*),(?<ttl>\d+),(?<id>[^,]*),(?<offset>[^,]*),(?<flags>[^,]*),(?<protocol_id>\d+),(?<protocol>\w+),(?<length>\d+),(?<src_ip>[\d\.]+),(?<dst_ip>[\d\.]+),(?<src_port>\d*),(?<dst_port>\d*),(?<data_length>\d*),(?<tcp_flags>\w*),(?<seq>\d*),(?<ack>\d*),(?<window>\d*),(?<urg>\d*),(?<options>.*)

# Field aliases for CIM
FIELDALIAS-src = src_ip AS src
FIELDALIAS-dest = dst_ip AS dest
FIELDALIAS-dest_ip = dst_ip AS dest_ip
FIELDALIAS-dport = dst_port AS dest_port
FIELDALIAS-sport = src_port AS src_port
FIELDALIAS-transport = protocol AS transport

# Eval for protocol names
EVAL-transport = case(protocol_id="6", "tcp", protocol_id="17", "udp", protocol_id="1", "icmp", 1=1, protocol)
