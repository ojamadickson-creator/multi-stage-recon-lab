# Saved Searches Configuration for SOC Lab
# Place in: $SPLUNK_HOME/etc/apps/soc_lab/local/savedsearches.conf

[Brute Force Detection]
search = index=main sourcetype="WinEventLog" EventCode=4625 | stats count by src_ip | where count > 5 | rename count as "failed_login_attempt" | sort -failed_login_attempt
alert.track = 1
cron_schedule = */1 * * * *
description = Detects brute force or password spray attacks by monitoring failed logon attempts (EventCode 4625) from a single source IP.
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
action.alert.track = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 5m
action.email.useNSSubject = 1
action.email.sendresults = 0
action.email.to = soc-team@windomain.local
action.email.subject = ALERT: Brute Force Detected from $result.src_ip$
action.email.message = A potential brute force attack has been detected. Source IP: $result.src_ip$ with $result.failed_login_attempt$ failed attempts.
display.general.type = statistics
display.visualizations.show = 0
request.ui_dispatch_app = search
request.ui_dispatch_view = search

[Successful Authentication After Failed Attempts]
search = index=main sourcetype="WinEventLog" EventCode=4624 src_ip="192.168.57.10" | eval LogonTypeDesc=case(Logon_Type=2, "Interactive", Logon_Type=3, "Network", Logon_Type=10, "RDP", 1=1, "Other") | table _time, Account_Name, src_ip, Logon_Type, LogonTypeDesc, ProcessName | sort -_time
alert.track = 1
cron_schedule = */5 * * * *
description = Monitors successful logons from known attacker IP addresses, particularly after brute force attempts.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 15m
action.email.useNSSubject = 1
action.email.sendresults = 1
action.email.to = soc-team@windomain.local
action.email.subject = ALERT: Successful Authentication from Attacker IP
action.email.message = Successful authentication detected from known attacker IP (192.168.57.10). Please investigate immediately.

[Privilege Escalation Detection]
search = index=main sourcetype="WinEventLog" EventCode=4672 | eval PrivilegeCount=mvcount(split(Privilege_List, ",")) | table _time, Account_Name, src_ip, Privilege_List, PrivilegeCount | sort -_time
alert.track = 1
cron_schedule = */5 * * * *
description = Detects privileged logon events (EventCode 4672) which indicate admin-equivalent access.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 10m
action.email.useNSSubject = 1
action.email.to = soc-team@windomain.local
action.email.subject = ALERT: Privileged Account Usage Detected
action.email.message = Privileged logon detected. Account: $result.Account_Name$ from IP: $result.src_ip$

[New Account Creation]
search = index=main sourcetype="WinEventLog" EventCode=4720 | table _time, Account_Name, New_Account_Name, src_ip | sort -_time
alert.track = 1
cron_schedule = */5 * * * *
description = Alerts on all new user account creations, which may indicate attacker persistence.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 30m
action.email.useNSSubject = 1
action.email.to = soc-team@windomain.local
action.email.subject = ALERT: New User Account Created
action.email.message = New account $result.New_Account_Name$ created by $result.Account_Name$ from $result.src_ip$

[Scheduled Task Creation]
search = index=main sourcetype="WinEventLog" EventCode=4698 | table _time, Account_Name, TaskName, src_ip | sort -_time
alert.track = 1
cron_schedule = */5 * * * *
description = Detects new scheduled task creation, a common persistence mechanism.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 30m
action.email.useNSSubject = 1
action.email.to = soc-team@windomain.local
action.email.subject = ALERT: Scheduled Task Created
action.email.message = New scheduled task "$result.TaskName$" created by $result.Account_Name$

[Firewall Cross-Zone Traffic from Kali]
search = index=main sourcetype=opnsense src_ip="192.168.57.10" | stats count by src_ip, dst_ip, dst_port, action | sort -count
alert.track = 1
cron_schedule = */5 * * * *
description = Monitors firewall logs for traffic originating from the attacker network (Kali) to internal systems.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 10
alert.suppress = 1
alert.suppress.period = 15m
action.email.useNSSubject = 1
action.email.to = soc-team@windomain.local
action.email.subject = ALERT: Cross-Zone Traffic from Kali

[Correlated Attack Chain Detection]
search = index=main host=dc (EventCode=4624 OR EventCode=4625 OR EventCode=4672) src_ip="192.168.57.10" | eval attack_phase=case(EventCode=4625 AND Account_Name!="$", "Phase 2: Brute Force Attempts", EventCode=4624 AND Logon_Type=3, "Phase 3: Successful SMB Compromise", EventCode=4624 AND Logon_Type=10, "Phase 3b: RDP Access", EventCode=4672 AND Account_Name!="$", "Phase 4: Privilege Escalation", 1=1, "Other") | where attack_phase!="Other" | stats count by attack_phase, src_ip | sort -count
alert.track = 1
cron_schedule = */5 * * * *
description = Correlates multiple authentication events from the attacker IP into a coherent attack chain timeline.
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 30m
action.email.useNSSubject = 1
action.email.to = soc-team@windomain.local
action.email.subject = CRITICAL: Multi-Phase Attack Chain Detected
action.email.message = A correlated attack chain has been detected from $result.src_ip$. Phase: $result.attack_phase$ with $result.count$ events.

[Time Series Failed Logins]
search = index=main sourcetype="WinEventLog" EventCode=4625 | timechart span=1m count by src_ip
alert.track = 0
cron_schedule = 0 * * * *
description = Generates a time series visualization of failed login attempts for dashboard display.
dispatch.earliest_time = -4h
dispatch.latest_time = now
enableSched = 1

[Attacker IP Activity Summary]
search = index=main src_ip="192.168.57.10" | stats count by sourcetype, EventCode | sort -count
alert.track = 0
cron_schedule = 0 * * * *
description = Summary of all activity from the known attacker IP address.
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
